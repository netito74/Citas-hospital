<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Universitario del Mar</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="Index.css">
</head>

<body>

    <!-- INICIO -->
    <section id="inicio" class="pantalla container mt-4">
        <div class="card shadow-lg p-4 p-md-5 bg-white rounded-4 mx-auto main-card">

            <!-- Logo y título -->
            <div class="text-center mb-3">
                <img src="logo.jpg" alt="Hospital" class="logo-hospital img-fluid">
                <h1 class="fw-bold text-primary titulo mt-3">Hospital Universitario del Mar</h1>
                <p class="text-secondary">"Dr. xxxxxxxx xxxxxxxxxx"</p>

                <!-- ENLACE A LA PÁGINA PUBLICADA -->
                <a href="https://netito74.github.io/Citas-hospital/" 
                   class="btn btn-info mt-2 w-100 w-md-auto"
                   target="_blank">
                   🌐 Ver versión en línea
                </a>
            </div>

            <hr>

            <h2 class="text-center fw-bold text-primary mb-4">Nuestra Identidad</h2>

            <div class="row g-4">

                <!-- Misión -->
                <div class="col-12 col-md-6">
                    <div class="info-box border-primary">
                        <h3 class="fw-bold text-primary text-uppercase">Misión</h3>
                        <p class="texto">
                            Brindar atención de salud integral y especializada...
                        </p>
                    </div>
                </div>

                <!-- Visión -->
                <div class="col-12 col-md-6">
                    <div class="info-box border-success">
                        <h3 class="fw-bold text-success text-uppercase">Visión</h3>
                        <p class="texto">
                            Llegar a ser una institución pública de segundo nivel...
                        </p>
                    </div>
                </div>

            </div>

            <!-- BOTONES -->
            <div class="text-center mt-4 d-flex flex-column flex-md-row justify-content-center gap-3">
                <button class="btn btn-primary btn-lg w-100 w-md-auto" onclick="mostrar('cita')">Generar Cita</button>
                <button class="btn btn-success btn-lg w-100 w-md-auto" onclick="mostrar('verCitas')">Ver Citas</button>
            </div>

        </div>
    </section>

    <!-- GENERAR CITA -->
    <section id="cita" class="container pantalla d-none mt-4">
        <div class="card shadow-lg p-4 p-md-5 bg-white rounded-4 mx-auto main-card">
            <h2 class="text-center fw-bold text-primary mb-4">Generar Cita</h2>

            <form id="formCita" class="row g-3">

                <div class="col-12 col-md-6">
                    <label class="form-label">Nombre del Paciente</label>
                    <input type="text" id="nombre" class="form-control" required>
                </div>

                <div class="col-6 col-md-3">
                    <label class="form-label">Edad</label>
                    <input type="number" id="edad" class="form-control" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Motivo de Consulta</label>
                    <input type="text" id="motivo" class="form-control" required>
                </div>

                <div class="col-6 col-md-6">
                    <label class="form-label">Fecha</label>
                    <input type="date" id="fecha" class="form-control" required>
                </div>

                <div class="col-6 col-md-6">
                    <label class="form-label">Hora</label>
                    <input type="time" id="hora" class="form-control" required>
                </div>

                <div class="col-12 text-center mt-3">
                    <button type="submit" class="btn btn-success btn-lg w-100 w-md-auto">Guardar Cita</button>
                </div>

            </form>

            <div class="text-center mt-4">
                <button class="btn btn-secondary w-100 w-md-auto" onclick="mostrar('inicio')">Volver</button>
            </div>
        </div>
    </section>

    <!-- VER CITAS -->
    <section id="verCitas" class="container pantalla d-none mt-4">
        <div class="card shadow-lg p-4 p-md-5 bg-white rounded-4 mx-auto main-card">

            <h2 class="text-center fw-bold text-primary mb-4">Citas Agendadas</h2>

            <div class="table-responsive">
                <table class="table table-striped" id="tablaVer">
                    <thead class="table-primary">
                        <tr>
                            <th>Nombre</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Motivo</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="text-center mt-4 d-flex flex-column flex-md-row justify-content-center gap-3">
                <button class="btn btn-warning btn-lg w-100 w-md-auto" onclick="mostrar('modificar')">Modificar Cita</button>
                <button class="btn btn-danger btn-lg w-100 w-md-auto" onclick="mostrar('eliminar')">Eliminar Cita</button>
                <button class="btn btn-secondary btn-lg w-100 w-md-auto" onclick="mostrar('inicio')">Volver</button>
            </div>

        </div>
    </section>

    <!-- (Aquí siguen las secciones Modificar y Eliminar tal como ya las tienes — NO ES NECESARIO CAMBIAR NADA) -->

    <!-- TU JAVASCRIPT SE MANTIENE IGUAL -->

</body>
</html>
